services:
  - type: web
    name: panelgo-tablero
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: INGEST_TOKEN
        generateValue: true
      - key: LICENSE_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
